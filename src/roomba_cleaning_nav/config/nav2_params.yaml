# Nav2 Parameters for Roomba 577

amcl:
  ros__parameters:
    use_sim_time: false
    # AMCL parameters (example values, tune for specific robot/environment)
    min_particles: 500
    max_particles: 2000
    kld_err: 0.05
    update_min_d: 0.25
    update_min_a: 0.2
    resample_interval: 1
    transform_tolerance: 0.5
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    initial_pose: [0.0, 0.0, 0.0] # x, y, yaw (rad)
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: scan
    set_model_path: ""

# Costmap common parameters (example values)
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3.0
      height: 3.0
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer", "static_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        parameters:
          observation_sources: laser_scan_sensor
          laser_scan_sensor: {topic: scan, max_obstacle_height: 2.0, clearing_global_frame: map, marking_global_frame: map, data_type: LaserScan, clearing_time: 5.0, min_obstacle_height: 0.0, expected_update_rate: 0.5, observation_persistence: 0.0, inf_is_valid: false, VoxelFilter: {filter_window_size: 2, filter_x: 4.0, filter_y: 4.0, filter_z: 2.0}}
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        parameters:
          inflation_radius: 0.5
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        parameters:
          map_subscribe_threshold: 0.5
          map_topic: map
          first_map_only: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        parameters:
          map_subscribe_threshold: 0.5
          map_topic: map
          first_map_only: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        parameters:
          observation_sources: laser_scan_sensor
          laser_scan_sensor: {topic: scan, max_obstacle_height: 2.0, clearing_global_frame: map, marking_global_frame: map, data_type: LaserScan, clearing_time: 5.0, min_obstacle_height: 0.0, expected_update_rate: 0.5, observation_persistence: 0.0, inf_is_valid: false, VoxelFilter: {filter_window_size: 2, filter_x: 4.0, filter_y: 4.0, filter_z: 2.0}}
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        parameters:
          inflation_radius: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    default_server_timeout: 20
    default_bt_tree: "navigate_w_replanning_and_recovery.xml" # default Nav2 BT tree
    plugin_lib_names:
      - nav2_behavior_tree
      - nav2_recoveries
      - nav2_actions
      - nav2_conditions

controller_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_z_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_simple_commander::SimpleCommanderController"
      parameters:
        max_vel_x: 0.5
        max_vel_y: 0.0
        max_vel_z: 0.0
        max_rotational_vel: 1.8
        min_vel_x: 0.1
        min_vel_y: 0.0
        min_vel_z: 0.0
        min_rotational_vel: 0.4
        accel_lim_x: 2.5
        accel_lim_y: 0.0
        accel_lim_theta: 3.2
        decel_lim_x: -2.5
        decel_lim_y: 0.0
        decel_lim_theta: -3.2
        sim_time: 2.0
        num_steps: 50
        odom_topic: odom
        cmd_vel_topic: cmd_vel

planner_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    planner_frequency: 1.0
    use_sim_time: false
    default_server_timeout: 20
    default_planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_grid_path_planner::GridBasedPlanner"
      parameters:
        optimize_path_for_smoothing: false
        use_astar: true
        allow_unknown: true
        tolerance: 0.5
        cost_travel_multiplier: 2.0
        grid_resolution: 0.05
        use_final_approach_orientation: false
        downsample_factor: 1
        max_iterations: 1000000

smoother_server:
  ros__parameters:
    use_sim_time: false
    algorithm: "none" # Currently no smoother is used by default in Nav2
    angle_tolerance: 0.001
    length_tolerance: 0.001
