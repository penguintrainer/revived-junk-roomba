# Robot Parameters for Roomba 577

robot_config:
  ros__parameters:
    # Roomba 577 specific parameters
    serial_port: /dev/ttyUSB0  # Adjust as needed for your Roomba connection
    baud_rate: 115200

    # Robot physical dimensions (example values, measure accurately)
    robot_radius: 0.175 # meters (approx half of 35cm diameter)
    wheel_distance: 0.235 # meters (distance between drive wheels)

    # Sensor topics (remapping if necessary)
    lidar_topic: scan
    camera_topic: camera_image

    # Joy-Con button mappings (example values, verify with actual Joy-Con)
    # These are 0-indexed button/axis numbers
    teleop_axis_linear: 1 # Left stick Y-axis
    teleop_axis_angular: 0 # Left stick X-axis
    button_clean_toggle: 0 # Example button A
    button_mode_toggle: 1 # Example button B
    button_safety_resume: 2 # Example button X

    # Low battery threshold (from spec clarification)
    battery_low_threshold_percent: 15 # Percentage, interpretation depends on manufacturer spec

    # Audio cues configuration (from spec clarification)
    audio_cue_mode_change: 1 # Beep pattern ID
    audio_cue_error: 2 # Beep pattern ID
    audio_cue_low_battery: 3 # Beep pattern ID

    # Zig-zag cleaning pattern parameters (from spec clarification)
    zigzag_overlap_percent: 75
    zigzag_boundary_distance: 0.10 # meters

    # Cable detection parameters (from spec clarification)
    cable_detection_min_contour_area: 100 # Example: pixels
    cable_detection_min_aspect_ratio: 5 # Example: aspect ratio
